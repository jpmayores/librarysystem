<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- Top Navigation Bar -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Library Portal</h1>
                    <p class="text-xs text-slate-500 font-medium">Browse, borrow, and read your favorite books</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- Search Bar -->
                <div class="relative flex-1 md:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" onkeyup="filterBooks()" placeholder="Search title or author..." class="w-full pl-9 pr-4 py-2 bg-slate-100 border border-transparent rounded-full text-xs text-slate-800 placeholder-slate-400 focus:bg-white focus:border-blue-500 focus:outline-none transition">
                </div>

                <a href="/admin.html" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-full transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-user-gear text-slate-400"></i> Admin
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto w-full px-6 py-8 flex-1">
        
        <!-- Category Filter Tabs -->
        <div class="flex items-center justify-between gap-4 mb-8 overflow-x-auto pb-2 scrollbar-none">
            <div class="flex items-center gap-2" id="categoryTabs">
                <button onclick="filterCategory('All')" class="cat-btn active border px-4 py-2 bg-blue-600 text-white border-blue-600 text-xs font-semibold rounded-full shadow-sm transition">All Books</button>
                <button onclick="filterCategory('Psychology')" class="cat-btn border px-4 py-2 bg-white text-slate-600 border-slate-200 hover:bg-slate-100 text-xs font-semibold rounded-full transition">Horror</button>
                <button onclick="filterCategory('History')" class="cat-btn border px-4 py-2 bg-white text-slate-600 border-slate-200 hover:bg-slate-100 text-xs font-semibold rounded-full transition">Fantasy</button>
                <button onclick="filterCategory('Science')" class="cat-btn border px-4 py-2 bg-white text-slate-600 border-slate-200 hover:bg-slate-100 text-xs font-semibold rounded-full transition">Food</button>
            </div>
        </div>

        <!-- Section Title -->
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                <span>Book Catalog</span>
                <span id="bookCountBadge" class="bg-slate-200 text-slate-700 text-xs font-extrabold px-2 py-0.5 rounded-full">0</span>
            </h2>
        </div>

        <!-- Book Grid -->
        <div id="portal-book-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic Cards Here -->
        </div>
    </main>

    <!-- Borrow Modal Form -->
    <div id="borrowModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-100">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                <div>
                    <h3 class="text-base font-bold text-slate-900">Borrow Book</h3>
                    <p class="text-xs text-slate-400 mt-0.5" id="borrowBookTitle">Book Title</p>
                </div>
                <button onclick="closeBorrowModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <form id="borrowForm" class="space-y-4">
                <input type="hidden" id="borrowBookId">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Borrower Full Name</label>
                    <input type="text" id="borrowerName" placeholder="e.g. Juan Dela Cruz" required class="w-full border border-slate-200 px-3.5 py-2.5 rounded-xl text-xs text-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Email / Contact Info</label>
                    <input type="email" id="borrowerEmail" placeholder="e.g. juan@gmail.com" required class="w-full border border-slate-200 px-3.5 py-2.5 rounded-xl text-xs text-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Borrow Duration (Days)</label>
                    <select id="borrowDays" class="w-full border border-slate-200 px-3.5 py-2.5 rounded-xl text-xs text-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white">
                        <option value="3">3 Days</option>
                        <option value="7" selected>7 Days (1 Week)</option>
                        <option value="14">14 Days (2 Weeks)</option>
                    </select>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeBorrowModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-semibold transition">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold transition shadow-md shadow-blue-500/20">Confirm Borrow</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-12">
        <div class="max-w-7xl mx-auto px-6 py-6 text-center text-xs text-slate-400 font-medium">
            Library Automation System &copy; 2026. All rights reserved.
        </div>
    </footer>

    <script>
        const API_URL = '/api';
        const defaultCover = 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=400';
        let allBooks = [];
        let activeCategory = 'All';

        async function loadPortalBooks() {
            try {
                const res = await fetch(`${API_URL}/books`);
                allBooks = await res.json();
                renderBooks();
            } catch (err) { 
                console.error("Error loading books:", err);
                document.getElementById('portal-book-list').innerHTML = `
                    <div class="col-span-full bg-red-50 border border-red-200 text-red-600 p-4 rounded-xl text-xs font-medium">
                        Unable to connect to the database server.
                    </div>
                `;
            }
        }

        function renderBooks() {
            const container = document.getElementById('portal-book-list');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = allBooks.filter(b => {
                const matchesCat = activeCategory === 'All' || (b.category && b.category.toLowerCase() === activeCategory.toLowerCase());
                const matchesSearch = b.title.toLowerCase().includes(searchVal) || b.author.toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            document.getElementById('bookCountBadge').innerText = filtered.length;

            if (!filtered.length) {
                container.innerHTML = `
                    <div class="col-span-full py-12 text-center bg-white border border-dashed border-slate-300 rounded-2xl">
                        <i class="fa-solid fa-book-open text-slate-300 text-4xl mb-3"></i>
                        <p class="text-sm font-semibold text-slate-600">No books found</p>
                        <p class="text-xs text-slate-400 mt-1">Try selecting another category or clear your search query.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(b => `
                <div class="group bg-white border border-slate-200/80 rounded-2xl p-4 shadow-sm hover:shadow-xl hover:-translate-y-1 transition duration-200 flex flex-col justify-between">
                    <div>
                        <!-- Cover Image Wrapper (Portrait Aspect Ratio 3:4) -->
                        <div class="relative w-full aspect-[3/4] rounded-xl overflow-hidden mb-4 bg-slate-100 flex items-center justify-center">
                            <img 
                                src="${b.image_url && b.image_url.trim() !== '' ? b.image_url : defaultCover}" 
                                onerror="this.onerror=null; this.src='${defaultCover}';"
                                class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                                alt="${b.title}"
                            >
                            <span class="absolute top-2.5 left-2.5 bg-slate-900/70 backdrop-blur-md text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
                                ${b.category || 'General'}
                            </span>
                        </div>

                        <!-- Book Info -->
                        <h3 class="font-bold text-slate-900 text-base leading-snug line-clamp-2 group-hover:text-blue-600 transition" title="${b.title}">
                            ${b.title}
                        </h3>
                        <p class="text-xs font-medium text-slate-400 mt-1 mb-4 line-clamp-1">by ${b.author}</p>
                    </div>

                    <!-- Footer Action -->
                    <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                        <span class="inline-flex items-center gap-1.5 text-[11px] font-bold px-2.5 py-1 rounded-full ${
                            b.status === 'Available' 
                                ? 'bg-emerald-50 text-emerald-700 border border-emerald-200/60' 
                                : 'bg-rose-50 text-rose-700 border border-rose-200/60'
                        }">
                            <span class="w-1.5 h-1.5 rounded-full ${b.status === 'Available' ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
                            ${b.status}
                        </span>

                        ${b.status === 'Available' 
                            ? `<button onclick="openBorrowModal(${b.id}, '${b.title.replace(/'/g, "\\'")}')" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold text-xs rounded-lg shadow-sm shadow-blue-500/30 transition">Borrow</button>`
                            : `<button disabled class="px-3.5 py-1.5 bg-slate-100 text-slate-400 font-semibold text-xs rounded-lg cursor-not-allowed">Borrowed</button>`
                            
                        }
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText.toLowerCase().includes(cat.toLowerCase()) || (cat === 'All' && btn.innerText.includes('All'))) {
                    btn.className = "cat-btn active border px-4 py-2 bg-blue-600 text-white border-blue-600 text-xs font-semibold rounded-full shadow-sm transition";
                } else {
                    btn.className = "cat-btn border px-4 py-2 bg-white text-slate-600 border-slate-200 hover:bg-slate-100 text-xs font-semibold rounded-full transition";
                }
            });
            renderBooks();
        }

        function filterBooks() {
            renderBooks();
        }

        // Modal Functions
        function openBorrowModal(bookId, bookTitle) {
            document.getElementById('borrowBookId').value = bookId;
            document.getElementById('borrowBookTitle').innerText = `Book: ${bookTitle}`;
            document.getElementById('borrowModal').classList.remove('hidden');
        }

        function closeBorrowModal() {
            document.getElementById('borrowModal').classList.add('hidden');
            document.getElementById('borrowForm').reset();
        }

        document.getElementById('borrowForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const bookId = document.getElementById('borrowBookId').value;
            const borrowerName = document.getElementById('borrowerName').value;
            const borrowerEmail = document.getElementById('borrowerEmail').value;
            const dueDays = document.getElementById('borrowDays').value;

            try {
                await fetch(`${API_URL}/borrow`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        book_id: bookId, 
                        borrower_name: borrowerName,
                        borrower_email: borrowerEmail,
                        due_days: parseInt(dueDays) 
                    })
                });
                closeBorrowModal();
                loadPortalBooks();
            } catch (err) { 
                console.error("Error borrowing book:", err); 
            }
        });

        document.addEventListener('DOMContentLoaded', loadPortalBooks);
    </script>
</body>
</html>
